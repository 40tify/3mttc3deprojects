# =============================================================================
# OpenMetadata Data Governance, Catalog & Quality Configuration
# =============================================================================

version: "1.2"
openmetadata:
  hostPort: "http://openmetadata-server:8585/api"
  authProvider: "openmetadata"

ingestion_pipelines:
  # 1. BigQuery Star Schema Data Warehouse Connector
  - name: "bigquery_lakehouse_metadata"
    type: "DatabaseService"
    service_name: "BigQuery-Agency-Banking"
    config:
      serviceType: "BigQuery"
      source:
        config:
          type: "BigQuery"
          scheme: "bigquery"
          project_id: "big-query-cluster"
          datasetFilterPattern:
            includes: ["john_lnd_stg_dataset", "john_dw_core_dataset", "john_dw_analytics_dataset"]
          enableParsedDataModel: true
          includeLineage: true
          includeTags: true

  # 2. Airflow Pipeline Orchestration Connector
  - name: "airflow_pipeline_metadata"
    type: "PipelineService"
    service_name: "Airflow-Agency-Banking"
    config:
      serviceType: "Airflow"
      source:
        config:
          type: "Airflow"
          hostPort: "http://airflow-webserver:8080"
          dagFilterPattern:
            includes:
              - "dag0_dimension_loader_dag"
              - "dag1_landing_data_generator_dag"
              - "dag2_core_elt_pipeline_dag"
              - "dag3_iceberg_archival_dag"
              - "dag4_agency_banking_lineage_dag"

  # 3. GCS Data Lake Storage Connector
  - name: "gcs_lakehouse_storage"
    type: "StorageService"
    service_name: "GCS-Agency-Banking"
    config:
      serviceType: "CustomStorage"
      source:
        config:
          type: "GCS"
          bucketNames: ["3mtt-mentees-bucket"]
          prefix: "john/"

data_quality_suites:
  # Quality Assertion Suite: Core Fact Table
  - table: "john_dw_core_dataset.fact_daily_transactions"
    tests:
      - testName: "column_values_to_not_be_null_transaction_id"
        columnName: "transaction_id"
        testDefinitionName: "columnValuesToBeNotNull"
      - testName: "column_values_to_be_unique_transaction_id"
        columnName: "transaction_id"
        testDefinitionName: "columnValuesToBeUnique"
      - testName: "column_values_to_be_between_transaction_amount"
        columnName: "transaction_amount"
        testDefinitionName: "columnValuesToBeBetween"
        params:
          minValue: 0
          maxValue: 10000000
      - testName: "column_values_to_not_be_null_agent_commission"
        columnName: "agent_commission"
        testDefinitionName: "columnValuesToBeNotNull"
      - testName: "column_values_to_not_be_null_agent_id"
        columnName: "agent_id"
        testDefinitionName: "columnValuesToBeNotNull"
      - testName: "column_values_to_not_be_null_txn_type_id"
        columnName: "txn_type_id"
        testDefinitionName: "columnValuesToBeNotNull"

  # Quality Assertion Suite: Dimensions
  - table: "john_dw_core_dataset.dim_agents"
    tests:
      - testName: "column_values_to_be_unique_agent_id"
        columnName: "agent_id"
        testDefinitionName: "columnValuesToBeUnique"
      - testName: "column_values_to_not_be_null_terminal_id"
        columnName: "terminal_id"
        testDefinitionName: "columnValuesToBeNotNull"

  - table: "john_dw_core_dataset.dim_customers"
    tests:
      - testName: "column_values_to_be_unique_customer_id"
        columnName: "customer_id"
        testDefinitionName: "columnValuesToBeUnique"

  - table: "john_dw_core_dataset.dim_transaction_types"
    tests:
      - testName: "column_values_to_be_unique_txn_type_id"
        columnName: "txn_type_id"
        testDefinitionName: "columnValuesToBeUnique"
